name: Build and deploy Authored by Grace

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install card renderer
        run: python -m pip install -r requirements.txt
      - name: Restore and validate exact approved homepage cover
        run: |
          {
            cat hero_parts_v3/p00.b64 hero_parts_v3/p01.b64 hero_parts_v3/p02.b64
            cat hero_parts_v3_fix/p03_0.b64 hero_parts_v3_fix/p03_1.b64 hero_parts_v3_fix/p03_2.b64 hero_parts_v3_fix/p03_3.b64
            cat hero_parts_v3_fix/p04_0.b64 hero_parts_v3_fix/p04_1.b64 hero_parts_v3_fix/p04_2.b64 hero_parts_v3_fix/p04_3.b64
            cat hero_parts_v3/p05.b64 hero_parts_v3/p06.b64 hero_parts_v3/p07.b64 hero_parts_v3/p08.b64
          } | tr -d '\n' | base64 --decode > assets/cards/series-cover-v3.jpg
          test "$(wc -c < assets/cards/series-cover-v3.jpg)" -eq 25065
          echo "e49049e4f8382ca35d1bb3b25f4bfb006ab633a3f8afe8f954e10953218cd558  assets/cards/series-cover-v3.jpg" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          cover = Path("assets/cards/series-cover-v3.jpg")
          with Image.open(cover) as image:
              if image.format != "JPEG":
                  raise SystemExit(f"Homepage cover must be JPEG, got {image.format}")
              if image.size != (600, 315):
                  raise SystemExit(f"Unexpected homepage cover size: {image.size}")
              image.verify()
          print("Validated exact approved homepage cover: 600x315 JPEG, 25065 bytes, SHA-256 match")
          PY
      - name: Check publishing contract
        run: python -m unittest -v test_publishing
      - name: Build static site
        env:
          SITE_URL: https://logosgsinc.github.io/LogosGSInc-morning-mercies-pilot/
        run: python3 build.py
      - name: Validate catalog output
        run: python -m unittest -v test_catalog
      - name: Build review preview including drafts
        if: github.event_name == 'pull_request'
        env:
          INCLUDE_DRAFTS: "1"
        run: python -c 'from pathlib import Path; import build; build.OUT_DIR = Path("_review_site"); build.build()'
      - name: Upload review preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: authored-by-grace-catalog-preview
          path: ./_review_site
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

