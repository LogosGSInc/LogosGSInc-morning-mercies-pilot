name: Build and deploy Morning Mercies

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          SITE_URL: https://logosgsinc.github.io/LogosGSInc-morning-mercies-pilot/
        run: python3 build.py
      - name: Render social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          find _site/assets/og -type f -name '*.svg' -print0 | while IFS= read -r -d '' svg; do
            png="${svg%.svg}.png"
            rsvg-convert -w 1200 -h 630 "$svg" -o "$png"
          done
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
